[project]
name = "agentic-hrms-backend"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "asyncpg",
    "pgvector>=0.4,<0.5",
    "google-genai>=2.20,<3",
    "langchain-google-genai>=4.4,<5",
    "langgraph>=1.2,<1.3",
    "pypdf>=6,<7",
    "langchain-text-splitters>=1,<2",
    "alembic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt",
    "cloudinary",
    "email-validator",
    "google-auth",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "black"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
