services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hrms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_dev_pass
      POSTGRES_DB: hrms_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  pgdata: