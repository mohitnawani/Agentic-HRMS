databases:
  - name: agentic-hrms-db
    databaseName: agentic_hrms
    user: agentic_hrms
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: agentic-hrms-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-hrms-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: agentic-hrms-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        value: ""
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSIONS
        value: 1536
      - key: RAG_GENERATION_MODEL
        value: gemini-3.5-flash-lite

  - type: web
    name: agentic-hrms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: 'off'
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: agentic-hrms-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_GOOGLE_LOGIN_ENABLED
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
